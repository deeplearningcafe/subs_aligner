[project.optional-dependencies]
audio = [
  "torch",
  "torchaudio",
  "silero-vad",
  "audio-separator",
  "python-dotenv",
]
predict = ["pykakasi", "pyopenjtalk"]

dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subtitle_aligner"]

[tool.uv.workspace]
members = ["ReazonSpeech/pkg/espnet-asr"]

[tool.uv.sources]
espnet-model-zoo = { git = "https://github.com/espnet/espnet_model_zoo", rev = "8b7301923c1c529a126c86c16fc73ce356b94d62" }
reazonspeech-espnet-asr = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
